name: 뉴스 수집

# 공개 피드는 최근 100건만 줍니다. 실제로 재어 보니 **7.6시간치**입니다.
# 즉 하루 한 번만 모으면 그날 기사의 3분의 1도 못 건집니다.
#
# 그래서 6시간마다 돕니다. 6시간 간격이면 7.6시간짜리 창이 서로 겹쳐서
# 사이가 비지 않습니다. 실행이 조금 밀려도(깃허브 예약은 최대 30분쯤 늦을 수
# 있습니다) 1.6시간의 여유가 있습니다.
#
# 미국 시장 기사는 미국장 시간(대략 UTC 13~21시)에 몰리므로, 그 구간이
# 두 번(14:11, 20:11) 들어가게 잡았습니다.
on:
  schedule:
    - cron: "11 2,8,14,20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write # 실패했을 때 이슈로 알리기 위해

concurrency:
  # 시세 갱신과 같은 파일(생성 JSON)을 건드리므로 줄을 세웁니다
  group: update-prices
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: 기사 모으기
        run: npm run news

      - name: 바뀐 것이 있으면 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/generated/news/
          if git diff --staged --quiet; then
            echo "새 기사가 없습니다. 커밋하지 않습니다."
            exit 0
          fi
          git commit -m "chore(news): 기사 수집 $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            echo "재시도 $i"
            sleep 5
          done
          echo "푸시에 실패했습니다"
          exit 1

      # ── 여기서부터는 **다 쌓은 뒤** 하는 판정입니다 ───────────────
      #
      # 커밋 앞에 두면 안 됩니다. 2026-09-01 에 그것 때문에 세 번 연속으로
      # 실패했고, **그때 모은 기사가 통째로 날아갔습니다.** 공개 피드는 몇
      # 시간치만 주므로 되찾을 수 없습니다.
      #
      # 시세 갱신 쪽은 반대로 검사를 커밋 앞에 둡니다. 거기서 걸리는 것은
      # 틀린 숫자라 화면에 올리면 안 되고, 다음 날 다시 계산하면 그만입니다.
      # 여기서 걸리는 것은 기사 한 건의 흠이라, 그것 때문에 하루치를 버리는
      # 쪽이 훨씬 손해입니다. **알리되 버리지는 않습니다.**
      - name: 데이터 무결성 검사
        run: npm run test:data

      # 피드는 예외 없이 죽습니다 — 주소가 바뀌거나 형식이 Atom 으로 바뀌면
      # 그냥 0건이 됩니다. 여기서 걸지 않으면 몇 달 뒤에야 "요즘 기사가
      # 적네" 하고 알게 됩니다.
      - name: 피드가 살아 있는지
        run: |
          if [ ! -f .feed-health ]; then echo "판정 파일이 없습니다"; exit 1; fi
          cat .feed-health
          if [ "$(jq -r .broken .feed-health)" = "true" ]; then
            echo "::error::절반 넘는 피드가 한 건도 주지 않았습니다"
            exit 1
          fi

      # 이쪽이야말로 알림이 필요합니다.
      #
      # 시세 갱신은 하루 한 번이고 실패하면 화면의 숫자가 어제 것으로 남아
      # 눈에 띕니다. 뉴스 수집은 **하루 네 번, 남의 서버 일곱 곳**에 기대는데
      # 실패해도 화면이 멀쩡해 보입니다. 기사가 조금씩 덜 쌓일 뿐입니다.
      # 그런데 공개 피드는 몇 시간치만 주므로 **그동안 지나간 기사는 영영
      # 되찾을 수 없습니다.** 조용히 실패하면 안 되는 쪽입니다.
      - name: 실패 알림
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="뉴스 수집 실패"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          open=$(gh issue list --search "$title in:title state:open" --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$(date -u +'%Y-%m-%d %H:%M UTC') 에 또 실패했습니다 — $run_url"
          else
            gh issue create --title "$title" --body "$(printf '자동 뉴스 수집이 실패했습니다. 지나간 기사는 되찾을 수 없으므로 빨리 보는 편이 좋습니다.\n\n로그: %s\n\n흔한 원인:\n- 피드 주소가 바뀌거나 형식이 Atom 으로 바뀜 (조용히 0건이 됩니다)\n- 매체가 요청을 막음\n- 무결성 검사에서 걸림 (이상한 링크·날짜)\n' "$run_url")"
          fi
