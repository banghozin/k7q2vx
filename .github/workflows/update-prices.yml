name: 시세 갱신

# 미국장 마감(동부 16:00 = UTC 20:00 또는 21:00) 이후에 돕니다.
# 서머타임 때문에 마감 시각이 UTC 기준으로 한 시간 움직이므로, 넉넉하게
# UTC 22:17 로 잡습니다. 두 경우 모두 마감 뒤입니다.
#
# 분을 :17 로 둔 이유: 깃허브는 :00 :15 :30 :45 처럼 붐비는 시각의 예약 실행을
# 부하가 걸리면 뒤로 미루거나 건너뜁니다. 어중간한 분이 밀릴 확률이 낮습니다.
# 예약 실행은 어차피 최대 30분쯤 늦어질 수 있는 best-effort 입니다.
on:
  schedule:
    - cron: "17 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write # 계산 결과를 저장소에 커밋하기 위해
  issues: write # 실패했을 때 이슈로 알리기 위해

concurrency:
  group: update-prices
  # 실행 중인 것을 죽이지 않고 줄을 세웁니다. 중간에 끊기면 반쪽짜리
  # JSON 이 커밋될 수 있습니다.
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 시작 기록
        run: |
          echo "트리거: ${{ github.event_name }}"
          echo "시각:   $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      # 티커가 죽었으면 조용히 넘어가면 안 됩니다.
      # 여기서 실패하면 아래 단계가 아예 돌지 않고, 이슈로 알림이 갑니다.
      - name: 티커 생존 검사
        run: npm run validate

      - name: 시세 수집
        run: npm run fetch

      - name: 지표 계산
        run: npm run compute

      # 계산 스크립트가 스스로 보는 것(NaN·Infinity)만으로는 안 잡히는 것들이
      # 있습니다 — 파일끼리 기준일이 어긋나거나, 없는 층에 판정이 붙거나,
      # 아카이브에 이상한 링크가 들어오는 경우입니다. 조용히 틀린 숫자를
      # 배포하는 것이 제일 나쁘므로 커밋 앞에서 막습니다.
      - name: 데이터 무결성 검사
        run: npm run test:data

      - name: 바뀐 것만 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/generated/
          if git diff --staged --quiet; then
            echo "바뀐 데이터가 없어 커밋하지 않습니다 (휴장일 등)"
            exit 0
          fi
          git commit -m "chore(data): 시세 갱신 $(date -u +'%Y-%m-%d')"
          # 동시에 다른 실행이 push 하는 경우를 대비해 재시도합니다
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "push 성공 (${attempt}번째 시도)"
              exit 0
            fi
            echo "push 실패 — pull --rebase 후 재시도"
            git pull --rebase origin main || exit 1
          done
          echo "5번 시도했지만 push 하지 못했습니다"
          exit 1

      # ── 뉴스는 **시세를 올린 뒤** 모읍니다 ────────────────────────────
      #
      # 예전에는 계산 다음, 무결성 검사 앞에서 모았습니다. 그러면 2026-09-01
      # 에 뉴스 수집 쪽에서 났던 사고가 여기서 그대로 재연됩니다 —
      # **기사 한 건의 흠 때문에 그날 모은 기사가 통째로 버려집니다.**
      # 공개 피드는 몇 시간치만 주므로 되찾을 수 없습니다.
      #
      # 순서를 바꾸면 둘이 서로를 못 죽입니다. 시세는 검사를 통과해야만
      # 올라가고(틀린 숫자를 배포하지 않기 위해), 기사는 시세와 무관하게
      # 따로 올라갑니다. 검사에서 걸려 여기까지 못 오더라도 다음 뉴스 수집
      # (UTC 02:11, 3시간 54분 뒤)이 피드 창(7.6시간) 안에 들어옵니다.
      - name: 뉴스 보관
        run: npm run news
        continue-on-error: true

      # 모으는 것은 남의 서버 사정으로 실패할 수 있어 넘어가지만(위),
      # **모아 놓고 못 올리는 것**은 그대로 사라지는 것이라 알려야 합니다.
      - name: 모은 기사 커밋
        run: |
          git add src/data/generated/news/
          if git diff --staged --quiet; then
            echo "새 기사가 없습니다."
            exit 0
          fi
          git commit -m "chore(news): 기사 수집 $(date -u +'%Y-%m-%d %H:%M')"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "push 성공 (${attempt}번째 시도)"
              exit 0
            fi
            echo "재시도 $attempt"
            sleep 5
          done
          echo "기사 push 에 실패했습니다"
          exit 1

      # 실패할 때마다 새 이슈를 만들면 알림이 쌓여 아무도 안 보게 됩니다.
      # 열린 이슈가 있으면 코멘트만 답니다.
      - name: 실패 알림
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="시세 갱신 실패"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          open=$(gh issue list --search "$title in:title state:open" --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$(date -u +'%Y-%m-%d %H:%M UTC') 에 또 실패했습니다 — $run_url"
          else
            gh issue create --title "$title" --body "$(printf '자동 시세 갱신이 실패했습니다.\n\n로그: %s\n\n흔한 원인:\n- 큐레이션한 종목이 상장폐지되거나 티커가 바뀜 (티커 생존 검사에서 멈춤)\n- Yahoo 가 일시적으로 요청을 막음\n' "$run_url")"
          fi
